<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing & Design Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg-elements">
        <div class="bg-grid-pattern"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="noise-overlay"></div>
    </div>
    <main class="hub-container">
        <header class="hub-header">
            <div class="header-brand">
                <span class="brand-name">SM.</span>
                <div class="header-hint-container">
                    <p id="nav-hint" class="nav-hint-text">Select a path to explore...</p>
                </div>
            </div>
            <div class="header-meta">
                <div class="status-indicator">
                    <span class="dot"></span>
                    <span>Available</span>
                </div>
                <div class="hub-clock" id="clock">00:00:00</div>
                <button class="theme-btn" id="theme-toggle" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <section class="minimal-hero">
            <div class="hero-content">
                <div class="profile-info">
                    <div class="hero-label">Creative Partner</div>
                    <h1 class="hero-title">
                        <span class="title-line">Shubham</span>
                        <span class="title-line">Mistry</span>
                    </h1>
                    <p class="hero-subtitle" id="typing-role">Digital Marketer • WordPress Developer • UI/UX Freelancer
                    </p>

                    <div class="hero-profile-anchor">
                        <div class="anchor-image">
                            <div class="interactive-face">
                                <div class="face-base">
                                    <div class="eye eye-left">
                                        <div class="pupil"></div>
                                    </div>
                                    <div class="eye eye-right">
                                        <div class="pupil"></div>
                                    </div>
                                    <div class="mouth"></div>
                                </div>
                            </div>
                        </div>
                        <div class="anchor-details">
                            <span class="anchor-name">SM. STUDIO</span>
                            <span class="anchor-status">EST. 2019</span>
                        </div>
                    </div>
                </div>

                <nav class="minimal-nav">
                    <button class="minimal-nav-item" data-panel="about"
                        data-hint="Discover the story, the drive, and the human behind the pixels.">
                        <span class="nav-index">01</span>
                        <span class="nav-text">About</span>
                    </button>
                    <button class="minimal-nav-item" data-panel="skills"
                        data-hint="The toolkit I use to turn coffee into digital experiences.">
                        <span class="nav-index">02</span>
                        <span class="nav-text">Expertise</span>
                    </button>
                    <button class="minimal-nav-item" data-panel="work"
                        data-hint="A curated gallery of my favorite digital experiments and successes.">
                        <span class="nav-index">03</span>
                        <span class="nav-text">Selected Works</span>
                    </button>
                    <button class="minimal-nav-item" data-panel="contact"
                        data-hint="Let's start a conversation that could lead to something great.">
                        <span class="nav-index">04</span>
                        <span class="nav-text">Connect</span>
                    </button>
                </nav>
            </div>
        </section>

        <footer class="minimal-footer">
            <div class="footer-left">
                <div class="location">Based in India</div>
            </div>
            <div class="footer-right">
                <div class="social-minimal">
                    <a href="https://in.linkedin.com/in/shubham-mistry-945754207" target="_blank"
                        rel="noopener noreferrer">LinkedIn</a>
                </div>
            </div>
        </footer>
    </main>

    <div id="panel-overlay" class="panel-overlay"></div>

    <aside id="side-panel" class="side-panel">
        <button class="panel-close"><i class="fas fa-chevron-left"></i> BACK TO HUB</button>
        <div id="panel-content" class="panel-content">
            <!-- Content injected via JS -->
        </div>
    </aside>

    <!-- Templates -->
    <template id="about-template">
        <div class="panel-inner">
            <h2 class="panel-title">The Story So Far</h2>
            <div class="panel-bio-grid">
                <div class="bio-text">
                    <p class="panel-bio">
                        Passionate Digital Marketer, WordPress developer, and UI/UX freelancer. I have a strong
                        foundation in these fields and have acquired my skills through self-learning and hands-on
                        implementation.
                    </p>
                    <p class="panel-bio">
                        The internet has been my ultimate teacher, guiding me on this exciting journey of professional
                        growth. I'm driven by the desire to provide employers with better results through continuous
                        learning.
                    </p>
                </div>
                <div class="bio-stats">
                    <div class="bio-stat-item">
                        <span class="stat-number">5+</span>
                        <span class="stat-label">Years of Experience</span>
                    </div>
                    <div class="bio-stat-item">
                        <span class="stat-number">10+</span>
                        <span class="stat-label">Core Skills</span>
                    </div>
                    <div class="bio-stat-item">
                        <span class="stat-number">∞</span>
                        <span class="stat-label">Self-Taught Drive</span>
                    </div>
                </div>
            </div>

            <div class="timeline">
                <div class="timeline-header">
                    <h3>Work Experience</h3>
                </div>
                <div class="timeline-item status-item">
                    <div class="timeline-dot status-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header-meta">
                            <h3>Available for Projects</h3>
                            <span class="timeline-company">Freelance</span>
                        </div>
                        <p class="timeline-date">Open to Work</p>
                        <p>I am currently open to freelance opportunities in Digital Marketing, UI/UX Design, and Web
                            Development.</p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header-meta">
                            <h3>Wavelinesports Pvt Ltd - Michael Phelps Swimming India</h3>
                            <span class="timeline-company">Digital Marketing Lead</span>
                        </div>
                        <p class="timeline-date">Present</p>
                        <p>Leading Digital Marketing. Managing ads platform for around 32 centers, maintaining the
                            online presence of all old and new centers, creating branding mockups for new centers,
                            planning social media posting, sales team & center coordination, and handling the website.
                        </p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header-meta">
                            <h3>Trupoint pvt ltd</h3>
                            <span class="timeline-company">Digital Marketer</span>
                        </div>
                        <p class="timeline-date">2023 - 2024</p>
                        <p>Handling clients' Facebook ads & Google ads accounts and generating conversions. Managing
                            social media accounts and creating content.</p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-header-meta">
                            <h3>Netweaver Technovations Pvt Ltd</h3>
                            <span class="timeline-company">Digital Marketer</span>
                        </div>
                        <p class="timeline-date">2021 - 2023</p>
                        <p>Achieved business goals based on Google Analytics. Executed web, SEO, and social media
                            campaigns. Generated leads using Pay Per Click marketing (PPC). Handled website fixes using
                            HTML, CSS, and JS. Created graphics and UI/UX designs using Canva and Figma.</p>
                    </div>
                </div>
            </div>

            <div class="personal-interests">
                <h4>Beyond Work</h4>
                <div class="interest-tags">
                    <span><i class="fas fa-graduation-cap"></i> Continuous Learning</span>
                    <span><i class="fas fa-globe"></i> Internet Exploration</span>
                    <span><i class="fas fa-lightbulb"></i> Self-Improvement</span>
                    <span><i class="fas fa-rocket"></i> Professional Growth</span>
                </div>
            </div>
        </div>
    </template>

    <template id="skills-template">
        <div class="panel-inner">
            <h2 class="panel-title">Technical Expertise</h2>
            <div class="skills-grid-new">
                <div class="skills-column">
                    <div class="skills-category">
                        <h4><i class="fas fa-chart-line"></i> Digital Marketing</h4>
                        <div class="skill-tags-minimal">
                            <span>Search Engine Optimization</span>
                            <span>Search Engine Marketing</span>
                            <span>Email Marketing</span>
                            <span>Google Analytics & GTM</span>
                            <span>Paid Media Marketing</span>
                            <span>Social Media Marketing</span>
                            <span>Pay Per Click (PPC)</span>
                            <span>Content Writing</span>
                        </div>
                    </div>

                    <div class="skills-category">
                        <h4><i class="fas fa-palette"></i> Design & Creative</h4>
                        <div class="skill-tags-minimal">
                            <span>Branding</span>
                            <span>Figma - UI UX - Prototyping</span>
                            <span>Graphic Designing (Canva)</span>
                            <span>Blender - 3D Model Design</span>
                            <span>Premier Pro</span>
                            <span>Logo Design</span>
                        </div>
                    </div>
                </div>

                <div class="skills-column">
                    <div class="skills-category">
                        <h4><i class="fas fa-code"></i> Engineering</h4>
                        <div class="skill-tags-minimal">
                            <span>HTML & CSS</span>
                            <span>JavaScript</span>
                            <span>WordPress Development</span>
                            <span>Responsive Design</span>
                        </div>
                    </div>

                    <div class="skills-category">
                        <h4><i class="fas fa-certificate"></i> Certifications</h4>
                        <div class="skill-tags-minimal">
                            <span>Fundamentals of Digital Marketing</span>
                            <span>Udemy Digital Marketing</span>
                            <span>Mobile App Development</span>
                            <span>Stock Market & Investment</span>
                            <span>Managerial Accounting</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="learning-section">
                <h4>Currently Learning</h4>
                <div class="learning-list">
                    <div class="learning-item">
                        <span class="learning-tag">Advanced 3D Modeling</span>
                        <p>Expanding Blender skills for more complex character and product designs.</p>
                    </div>
                    <div class="learning-item">
                        <span class="learning-tag">AI-Driven Marketing</span>
                        <p>Exploring how to leverage AI tools for better conversion and automation.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="work-template">
        <div class="panel-inner">
            <h2 class="panel-title">Selected Works</h2>
            <div class="work-development">
                <div class="dev-icon"><i class="fas fa-tools"></i></div>
                <p>Curating new projects and case studies.</p>
                <span class="status-badge">IN DEVELOPMENT</span>
            </div>
        </div>
    </template>

    <template id="contact-template">
        <div class="panel-inner">
            <h2 class="panel-title">Let's Connect</h2>
            <div class="contact-grid-new">
                <div class="contact-info-new">
                    <p class="panel-bio">I'm always open to discussing new projects, creative ideas or opportunities to
                        be part of your visions.</p>

                    <div class="contact-details-minimal">
                        <div class="detail-item-new">
                            <span class="detail-label">Email</span>
                            <a href="mailto:shubhammistry11@gmail.com"
                                class="detail-value">shubhammistry11@gmail.com</a>
                        </div>
                        <div class="detail-item-new">
                            <span class="detail-label">Location</span>
                            <span class="detail-value">India (Open to Global Work)</span>
                        </div>
                        <div class="detail-item-new">
                            <span class="detail-label">Socials</span>
                            <div class="social-links-minimal">
                                <a href="https://in.linkedin.com/in/shubham-mistry-945754207" target="_blank"
                                    rel="noopener noreferrer">LinkedIn</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="contact-form-container">
                    <form id="contact-form" class="panel-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" name="name" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" placeholder="john@example.com" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Company Name</label>
                                <input type="text" name="company" placeholder="Acme Inc." required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" name="phone" placeholder="+1 (555) 000-0000" required>
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="panel-submit-new">START A CONVERSATION <i
                                class="fas fa-paper-plane"></i></button>
                        <div id="form-status" class="form-status-msg"></div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>

</html>
